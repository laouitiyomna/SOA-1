spring:
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    port: 5672
    username: "guest"
    password: "guest"
  application:
    name: genre
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}"
  datasource:
    url: 'jdbc:h2:mem:genredb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    discovery:
      enabled: true
eureka:
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: '${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}'
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.hostname}:${server.port:8080}
management:
  endpoints:
    web:
      exposure:
        include: '*'